{% extends "base.html" %}
{% load static %}

{% block content %}
<h2 class="page-title">{{ subtitle_list.title }}</h2>

<div class="study-wrapper">

  <div class="main-container">
    <!-- Карточка и навигация -->
    <div class="card-area">
      <div class="card-container">
        <div class="flashcard" id="card">
          <div class="card-face front">
            <h2 id="word"></h2>
            <small id="transcription"></small>
          </div>
          <div class="card-face back">
            <h3 id="translation"></h3>
          </div>
        </div>
      </div>

      <!-- Прогресс и поле ввода -->
      <div class="progress-info mt-2">
        <span id="current-index">1</span> / <span class="total-words">1</span>
      </div>

      <input
        type="text"
        id="answer"
        class="form-control mt-2"
        placeholder="Введите перевод">

      <div id="feedback" class="mt-2" style="height: 24px;"></div>

      <!-- Навигационные кнопки -->
      <div class="controls mt-3">
        <button class="btn nav-btn" id="prev">
            <img src="{% static 'study/icons/left-arrow.png' %}" alt="prev">
        </button>
        <button class="btn btn-success nav-btn" id="check">
            <img src="{% static 'study/icons/check-mark.png' %}" alt="check">
        </button>
        <button class="btn nav-btn" id="next">
            <img src="{% static 'study/icons/right-arrow.png' %}" alt="next">
        </button>
      </div>
    </div>

    <!-- Боковая панель справа -->
    <div class="sidebar">
      <div class="timer-box">
        Таймер: <span id="timer">00:00</span>
      </div>
      <div class="correct-box mt-2">
        Правильных: <span id="correct-count">0</span> / <span class="total-words">1</span>
      </div>
      <div class="finish-box mt-3">
        <button class="btn btn-danger" id="finish">Завершить тест</button>
      </div>
    </div>

  </div>

</div>

<script>
  const WORDS = {{ words_json|safe }};
</script>

<script src="{% static 'study/js/flashcards.js' %}"></script>
<link rel="stylesheet" href="{% static 'study/css/flashcards.css' %}">
{% endblock %}
